name: Build Obsidian Plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build plugin with Windows helper
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Build Rust clipboard helper
        run: npm run build:helper

      - name: Stage helper executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item helper\target\release\excel-html-clipboard.exe bin\excel-html-clipboard-win32-x64.exe

      - name: Build Obsidian plugin
        run: npm run build

      - name: Prepare package with helper
        shell: pwsh
        run: |
          $pluginId = (Get-Content manifest.json | ConvertFrom-Json).id
          $packageDir = "dist\with-helper\$pluginId"
          New-Item -ItemType Directory -Force -Path "$packageDir\bin" | Out-Null
          Copy-Item manifest.json "$packageDir\manifest.json"
          Copy-Item main.js "$packageDir\main.js"
          Copy-Item styles.css "$packageDir\styles.css"
          Copy-Item bin\excel-html-clipboard-win32-x64.exe "$packageDir\bin\excel-html-clipboard-win32-x64.exe"

      - name: Prepare package without helper
        shell: pwsh
        run: |
          $pluginId = (Get-Content manifest.json | ConvertFrom-Json).id
          $packageDir = "dist\no-helper\$pluginId"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item manifest.json "$packageDir\manifest.json"
          Copy-Item main.js "$packageDir\main.js"
          Copy-Item styles.css "$packageDir\styles.css"

      - name: Create release zips
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.json | ConvertFrom-Json
          $pluginId = $manifest.id
          $version = $manifest.version
          Compress-Archive -Path "dist\with-helper\$pluginId" -DestinationPath "dist\$pluginId-$version-with-helper.zip" -Force
          Compress-Archive -Path "dist\no-helper\$pluginId" -DestinationPath "dist\$pluginId-$version-no-helper.zip" -Force
          Copy-Item manifest.json "dist\manifest.json"
          Copy-Item main.js "dist\main.js"
          Copy-Item styles.css "dist\styles.css"

      - name: Verify release zip structure
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.json | ConvertFrom-Json
          $pluginId = $manifest.id
          $version = $manifest.version
          $archives = @(
            "dist\$pluginId-$version-with-helper.zip",
            "dist\$pluginId-$version-no-helper.zip"
          )
          $requiredEntries = @(
            "$pluginId/manifest.json",
            "$pluginId/main.js",
            "$pluginId/styles.css"
          )

          foreach ($archive in $archives) {
            $entries = @(tar -tf $archive | ForEach-Object { $_.Replace('\', '/') })
            $invalidEntries = @($entries | Where-Object { $_ -and -not $_.StartsWith("$pluginId/") })
            if ($invalidEntries.Count -gt 0) {
              throw "$archive contains entries outside $pluginId/: $($invalidEntries -join ', ')"
            }
            foreach ($requiredEntry in $requiredEntries) {
              if ($entries -notcontains $requiredEntry) {
                throw "$archive is missing $requiredEntry"
              }
            }
          }

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: excel-html-paste-plugin
          path: |
            dist/with-helper/excel-html-paste
            dist/no-helper/excel-html-paste
            dist/*.zip
            dist/manifest.json
            dist/main.js
            dist/styles.css
          retention-days: 7

      - name: Attach plugin package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/manifest.json
            dist/main.js
            dist/styles.css
